spack:
 # The "::" removes all found/known compilers from Spack except for these.
  compilers::
  - compiler:
      spec: clang@=19.1.7
      paths:
        cc: /opt/homebrew/opt/llvm/bin/clang
        cxx: /opt/homebrew/opt/llvm/bin/clang++
        f77: /opt/homebrew/bin/gfortran-14
        fc: /opt/homebrew/bin/gfortran-14
      flags: {}
      operating_system: sequoia
      target: aarch64
      modules: []
      environment: {}
      extra_rpaths:
      - /opt/homebrew/lib/gcc/14
  - compiler:
      spec: gcc@=14.2.0
      paths:
        cc: /opt/homebrew/opt/gcc/bin/gcc-14
        cxx: /opt/homebrew/opt/gcc/bin/g++-14
        f77: /opt/homebrew/bin/gfortran-14
        fc: /opt/homebrew/bin/gfortran-14
      flags: {}
      operating_system: sequoia
      target: aarch64
      modules: []
      environment: {}
      extra_rpaths:
      - /opt/homebrew/lib/gcc/14
  # add package specs to the `specs` list

  view: true
  concretizer:
    unify: true

  packages:
    all:
      compiler: [clang, gcc]
      providers:
        blas: [netlib-lapack]
        lapack: [netlib-lapack]
        mpi: [openmpi]

    mpi:
      buildable: false
    openmpi:
      buildable: false
      externals:
      - spec: openmpi@5.0.7
        prefix: /opt/homebrew
        
    hdf5:
      version: [1.14.6]
      buildable: false
      externals:
      - spec: hdf5@1.14.6
        prefix: /opt/homebrew
    lua:
      version: [5.4.7]
      buildable: false
      externals:
      - spec: lua@5.4.7
        prefix: /opt/homebrew
    netlib-lapack:
      buildable: false
      externals:
      - spec: netlib-lapack@3.12.1
        prefix: /opt/homebrew/opt/lapack

    # Devtools
    cmake:
      version: [3.31.6]
      buildable: false
      externals:
      - spec: cmake@3.31.6
        prefix: /opt/homebrew
    doxygen:
      version: [1.13.2]
      buildable: false
      externals:
      - spec: doxygen@1.13.2
        prefix: /opt/homebrew
    llvm:
      version: [14.0.6]
      buildable: false
      externals:
      - spec: llvm@14.0.6+clang
        prefix: /opt/homebrew/opt/llvm@14
    python:
      version: [3.13.2]
      buildable: false
      externals:
      - spec: python@3.13.2
        prefix: /opt/homebrew
    py-sphinx:
      version: [8.2.3]
      buildable: false
      externals:
      - spec: py-sphinx@8.2.3
        prefix: /opt/homebrew

