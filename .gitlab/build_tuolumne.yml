####
# This is the shared configuration of jobs for tuolumne
.on_tuolumne:
  variables:
    SCHEDULER_PARAMETERS: "--queue pci --exclusive --time-limit=${ALLOC_TIME}m --nodes=${ALLOC_NODES}"
    COMPILER: "llvm-amdgpu@6.4.2"
    HOST_CONFIG: "tuolumne-toss_4_x86_64_ib_cray-${COMPILER}_hip.cmake"
  tags:
    - batch
    - tuolumne
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /_qnone/ || $ON_TUOLUMNE == "OFF"' #run except if ...
      when: never
  before_script:
    - module load cmake/3.29.2

####
# Templates
.src_build_on_tuolumne:
  extends: [.src_build_script, .on_tuolumne, .src_workflow]

.tpl_build_on_tuolumne:
  extends: [.tpl_build_script, .on_tuolumne, .tpl_workflow]
  before_script:
    # LC version of pip is ancient
    - if [[ $(python3 -c 'import pip; print(pip.__version__ < "19.3")') == "True" ]]; then python3 -m pip install --user --upgrade pip; fi

####
# Build jobs
tuolumne-llvm_amdgpu_6_4_2-src:
  variables:
    ALLOC_NODES: "1"
    ALLOC_TIME: "30"
  extends: .src_build_on_tuolumne

####
# TPL Build jobs
tuolumne-llvm_amdgpu_6_4_2-tpl:
  variables:
    SPEC: "~devtools~adiak~caliper~openmp+rocm+enzyme amdgpu_target=gfx942,gfx90a %rocm_6_4_2"
    ALLOC_NODES: "1"
    ALLOC_TIME: "90"
  extends: .tpl_build_on_tuolumne
