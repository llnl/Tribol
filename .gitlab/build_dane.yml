####
# This is the shared configuration of jobs for dane
.on_dane:
  variables:
    SCHEDULER_PARAMETERS: "--reservation=ci --exclusive=user --deadline=now+${ALLOC_DEADLINE}minutes -N ${ALLOC_NODES} -t ${ALLOC_TIME}"
    ALLOC_DEADLINE: "180" # Allocation times must be less than this value
  tags:
    - batch
    - dane
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /_qnone/ || $ON_DANE == "OFF"' #run except if ...
      when: never
  before_script:
    - module load cmake/3.30.5


####
# Templates
.src_build_on_dane:
  extends: [.src_build_script, .on_dane, .src_workflow]

.tpl_build_on_dane:
  extends: [.tpl_build_script, .on_dane, .tpl_workflow]

####
# Build jobs

dane-llvm_19_1_3-src:
  variables:
    COMPILER: "llvm@19.1.3"
    HOST_CONFIG: "dane-toss_4_x86_64_ib-${COMPILER}.cmake"
    ALLOC_NODES: "1"
    ALLOC_TIME: "30"
  extends: .src_build_on_dane

dane-llvm_19_1_3-src-release:
  variables:
    COMPILER: "llvm@19.1.3"
    HOST_CONFIG: "dane-toss_4_x86_64_ib-${COMPILER}.cmake"
    EXTRA_CMAKE_OPTIONS: "-DCMAKE_BUILD_TYPE=Release"
    ALLOC_NODES: "1"
    ALLOC_TIME: "30"
  extends: .src_build_on_dane

dane-llvm_19_1_3-src-no-tpls:
  variables:
    COMPILER: "llvm@19.1.3"
    HOST_CONFIG: "dane-toss_4_x86_64_ib-${COMPILER}.cmake"
    EXTRA_CMAKE_OPTIONS: "-DBUILD_REDECOMP=OFF -URAJA_DIR -UUMPIRE_DIR -UENZYME_DIR -DTRIBOL_USE_OPENMP=OFF -DENABLE_OPENMP=ON"
    ALLOC_NODES: "1"
    ALLOC_TIME: "30"
  extends: .src_build_on_dane

dane-gcc_13_3_1-src:
  variables:
    COMPILER: "gcc@13.3.1"
    HOST_CONFIG: "dane-toss_4_x86_64_ib-${COMPILER}.cmake"
    ALLOC_NODES: "1"
    ALLOC_TIME: "20"
  extends: .src_build_on_dane

dane-llvm_19_1_3-tpl:
  variables:
    SPEC: "%clang_19"
    ALLOC_NODES: "1"
    ALLOC_TIME: "45"
  extends: .tpl_build_on_dane

dane-gcc_13_3_1-tpl:
  variables:
    SPEC: "%gcc_13"
    ALLOC_NODES: "1"
    ALLOC_TIME: "45"
  extends: .tpl_build_on_dane
