{
  "schema_version": 1,
  "requirements": [
    {"id": "API-001", "scope": "api", "text": "A default frictionless penalty contact method is available without naming a legacy method."},
    {"id": "API-002", "scope": "api", "text": "Structurally incompatible policy combinations are rejected at compile time."},
    {"id": "API-003", "scope": "api", "text": "Geometry updates preserve frozen interaction topology and invalidate state-derived results."},
    {"id": "API-004", "scope": "api", "text": "Topology rebuilds invalidate interactions and require a new interaction search."},
    {"id": "CORE-001", "scope": "core", "text": "Kernel-facing mesh and field views are trivially copyable and independent of third-party libraries."},
    {"id": "CORE-002", "scope": "core", "text": "Two- and three-dimensional segment, triangle, and quadrilateral surface topology is supported."},
    {"id": "CORE-003", "scope": "core", "text": "Evaluation performs no allocation after interaction preparation."},
    {"id": "GEOM-001", "scope": "component", "text": "Projected-overlap geometry provides measure, normal, quadrature coordinates, and signed normal gap."},
    {"id": "GEOM-002", "scope": "component", "text": "Conforming-overlap geometry preserves aligned face correspondence."},
    {"id": "GEOM-003", "scope": "component", "text": "Smoothed segment integration reproduces legacy C1 endpoint-bound smoothing and differentiates its geometry-dependent bounds exactly."},
    {"id": "CONS-001", "scope": "component", "text": "Pointwise, nodal primal, nodal dual, and quadrature-point normal constraints satisfy their documented interpolation contracts."},
    {"id": "ENF-001", "scope": "component", "text": "Constant and material-scaled kinematic penalty laws are supported."},
    {"id": "ENF-002", "scope": "component", "text": "No-rate, constant-rate, and percentage-rate penalty laws are supported."},
    {"id": "ENF-003", "scope": "component", "text": "Nodal Lagrange multiplier enforcement produces primal and constraint residuals."},
    {"id": "ENF-004", "scope": "component", "text": "Externally staged nodal pressure produces a consistent residual, potential, and coordinate linearization."},
    {"id": "RESP-001", "scope": "component", "text": "Frictionless and viscous tangential response are supported."},
    {"id": "RESP-002", "scope": "component", "text": "Tied-normal and tied-full response use reference coordinates."},
    {"id": "FORM-001", "scope": "component", "text": "Pointwise traction, weighted weak form, variational, and diagnostic-weight formulations share reusable stages."},
    {"id": "DIFF-001", "scope": "derivative", "text": "Exact matrix-free coordinate derivatives agree with independent centered finite differences on frozen interactions away from nonsmooth branch boundaries."},
    {"id": "DIFF-002", "scope": "derivative", "text": "Assembled and matrix-free derivative actions agree."},
    {"id": "DIFF-003", "scope": "derivative", "text": "The supported exact linearization is implemented in-tree without an Enzyme dependency, and reserved legacy linearization tags are rejected."},
    {"id": "SEARCH-001", "scope": "search", "text": "Cartesian-product, grid, and BVH search produce equivalent candidate sets."},
    {"id": "SEARCH-002", "scope": "search", "text": "Self-contact removes duplicate and configured adjacent pairs."},
    {"id": "SEARCH-003", "scope": "search", "text": "Callers can supply, validate, deduplicate, and replace candidate element pairs without invoking broad-phase search."},
    {"id": "SEARCH-004", "scope": "search", "text": "Broad-phase searches support element-size-relative inflation plus absolute residual-gap inflation using the legacy proximity formula."},
    {"id": "ADAPTER-001", "scope": "adapter", "text": "A borrowed-array surface adapter uses the public core interface without MFEM."},
    {"id": "ADAPTER-002", "scope": "adapter", "text": "MFEM ParMesh and true-DOF fields use an ergonomic contact factory."},
    {"id": "ADAPTER-003", "scope": "adapter", "text": "Primal restriction and dual transpose satisfy the global adjoint identity."},
    {"id": "ADAPTER-004", "scope": "adapter", "text": "MFEM nodal state and coefficient fields map to contact velocity, reference-coordinate, multiplier, external potential/pressure/tangent, material, and thickness state without manual array conversion."},
    {"id": "ADAPTER-005", "scope": "adapter", "text": "MFEM users can stage nodal kinematics and project nodal contact gap, weighted gap, tributary area, and pressure diagnostics into scalar parent-mesh fields."},
    {"id": "ADAPTER-006", "scope": "adapter", "text": "MFEM high-order boundary tessellation accepts an explicit subdivision factor and preserves primal/dual transfer behavior when that factor differs from polynomial order."},
    {"id": "DIFF-004", "scope": "derivative", "text": "The MFEM adapter exposes an assembled distributed coordinate Jacobian whose action matches the exact matrix-free derivative."},
    {"id": "DIFF-005", "scope": "derivative", "text": "Full multiplier saddle-system Jacobians include identity equations for inactive multiplier degrees of freedom."},
    {"id": "DIFF-006", "scope": "derivative", "text": "The MFEM adapter assembles distributed force-coordinate, force-multiplier, constraint-coordinate, and inactive-multiplier blocks into a solver-ready block operator."},
    {"id": "DIFF-007", "scope": "derivative", "text": "Exact state derivatives with respect to velocity, reference coordinates, element thickness, and material modulus agree with centered finite differences."},
    {"id": "PAR-001", "scope": "parallel", "text": "Sequential and CUDA default-method forces, activation controls, penetration rejection, diagnostics, energy, and derivative operators agree within documented tolerances on a real device."},
    {"id": "PAR-002", "scope": "parallel", "text": "One-, two-, and four-rank results are partition invariant."},
    {"id": "PAR-003", "scope": "parallel", "text": "Deterministic execution is reproducible and agrees with default execution."},
    {"id": "PAR-004", "scope": "parallel", "text": "OpenMP evaluates every supported host policy tuple with thread-local accumulation and agrees with sequential execution."},
    {"id": "PAR-005", "scope": "parallel", "text": "The MFEM adapter assigns interactions to mortar-owning ranks, exchanges only rank-neighbor nonmortar ghosts, returns ghost residuals to their owning ranks without global surface replication, and rebuilds the ghost topology after large motion."},
    {"id": "PHYS-001", "scope": "conformance", "text": "Contact residuals conserve linear momentum."},
    {"id": "PHYS-002", "scope": "conformance", "text": "Conservative formulations satisfy energy-gradient consistency."},
    {"id": "PHYS-003", "scope": "conformance", "text": "Supported formulations pass analytic patch tests for their dimensions and topologies."},
    {"id": "OUTPUT-001", "scope": "output", "text": "Forces, nodal and quadrature gaps and pressures, weighted gaps, tributary areas, mortar weights, energy, and timestep votes are exposed when supported."},
    {"id": "OUTPUT-002", "scope": "output", "text": "Contact surfaces, interactions, result fields, and overlap geometry can be written in deterministic JSON and VTK formats using cycle-based, rank-safe output paths."},
    {"id": "TIME-001", "scope": "component", "text": "Optional kinematic timestep voting limits projected and existing interpenetration using face thickness and velocity, matching the legacy common-plane behavior."},
    {"id": "LEGACY-001", "scope": "conformance", "text": "Policy-composed pointwise contact matches the implemented legacy common-plane penalty, rate, viscous, tied, residual-gap, and overlap-centroid force formulas."},
    {"id": "LEGACY-002", "scope": "conformance", "text": "Policy-composed weak-form and variational contact match legacy mortar weights, nodal gaps, pressure forces, residual-gap activation, and Energy Mortar derivative behavior."},
    {"id": "LEGACY-003", "scope": "conformance", "text": "Self-contact rejects full-overlap pairs beyond the configured fraction of the smaller element thickness, including the residual-gap shift used by legacy Tribol."},
    {"id": "QUALITY-001", "scope": "quality", "text": "Core dependency boundaries, header self-containment, formatting, static analysis, documentation, and install consumption are checked in CI."}
  ]
}
